apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nuxt-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: nuxt-app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nuxt-service
            port:
              number: 80