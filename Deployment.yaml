apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuxt-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nuxt-app
  template:
    metadata:
      labels:
        app: nuxt-app
    spec:
      containers:
      - name: nuxt-container
        image: aqsa21/nuxt-app:latest
        ports:
        - containerPort: 3000